version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colaolink-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - TEMP_STORAGE_DIR=/tmp/colaolink-downloads
      - QUEUE_CONCURRENCY=3
      - YT_DLP_PATH=/usr/local/bin/yt-dlp
      - FFMPEG_PATH=/usr/bin/ffmpeg
    volumes:
      - colaolink-temp:/tmp/colaolink-downloads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - colaolink-net

  redis:
    image: redis:7-alpine
    container_name: colaolink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - colaolink-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - colaolink-net

volumes:
  colaolink-temp:
  colaolink-redis-data:

networks:
  colaolink-net:
    driver: bridge

